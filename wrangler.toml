name = "jproxy"
main = "worker.js"
compatibility_date = "2026-08-01"

# Uncomment and set your own route/subdomain if you want a custom domain
# instead of the default *.workers.dev URL.
# routes = [
#   { pattern = "jproxy.yourdomain.com", custom_domain = true }
# ]
[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
